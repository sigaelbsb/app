<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Fondo Circular Cian / Hielo Tecnológico -->
  <circle cx="60" cy="60" r="56" fill="#cffafe" stroke="#0891b2" stroke-width="3.5"/>
  <circle cx="60" cy="60" r="51" fill="#a5f3fc" opacity="0.45"/>

  <!-- Torso y Sudadera / Franela Tecnológica Azul Cobalto -->
  <path d="M22 114 C22 88, 38 78, 60 78 C82 78, 98 88, 98 114 Z" fill="#1d4ed8"/>
  <path d="M46 78 C46 90, 74 90, 74 78 Z" fill="#1e3a8a"/>

  <!-- Cuello -->
  <rect x="53" y="66" width="14" height="15" rx="4" fill="#fed7aa"/>
  <path d="M53 72 C53 77, 67 77, 67 72 Z" fill="#fba666" opacity="0.5"/>

  <!-- Cabeza -->
  <ellipse cx="60" cy="48" rx="20" ry="24" fill="#fed7aa"/>

  <!-- Cabello Moderno con Tupé -->
  <path d="M38 42 C36 26, 48 18, 60 16 C70 17, 82 23, 82 42 C78 28, 72 24, 62 23 C50 22, 42 28, 38 42 Z" fill="#0f172a"/>
  <!-- Picos de Cabello Dinámicos -->
  <polygon points="50,17 54,11 58,18" fill="#0f172a"/>
  <polygon points="62,17 66,10 70,17" fill="#0f172a"/>

  <!-- Audífonos Diadema Tecnológica -->
  <!-- Arco Superior -->
  <path d="M34 48 C34 22, 86 22, 86 48" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M36 46 C36 24, 84 24, 84 46" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Almohadillas / Auriculares -->
  <rect x="30" y="42" width="9" height="16" rx="4.5" fill="#0369a1" stroke="#0284c7" stroke-width="2"/>
  <rect x="81" y="42" width="9" height="16" rx="4.5" fill="#0369a1" stroke="#0284c7" stroke-width="2"/>

  <!-- Cejas -->
  <path d="M47 40 Q52 38 56 40" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M64 40 Q68 38 73 40" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Ojos Despiertos -->
  <circle cx="51" cy="46" r="2.8" fill="#0f172a"/>
  <circle cx="50" cy="45" r="1" fill="#ffffff"/>
  <circle cx="69" cy="46" r="2.8" fill="#0f172a"/>
  <circle cx="68" cy="45" r="1" fill="#ffffff"/>

  <!-- Sonrisa Tecnológica Entusiasta -->
  <path d="M53 57 Q60 63 67 57" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</svg>